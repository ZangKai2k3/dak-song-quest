<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <meta name="description" content="Đắk Song Quest - Khám phá Đắk Song qua mini game, bản đồ, lưu trú và voucher thực tế." />
    <link rel="icon" type="image/png" href="/logo-dak-song.png" />
    <link rel="apple-touch-icon" href="/logo-dak-song.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Đắk Song Quest - Khám phá Núi Rừng Tây Nguyên</title>
    <script>
      // Ngăn chặn lỗi zmp-sdk tự động gọi login khi chạy ngoài môi trường app Zalo (ví dụ test trên laptop/trình duyệt thường)
      window.addEventListener("unhandledrejection", function (event) {
        if (
          event.reason &&
          (event.reason.api === "login" || event.reason.code === -2000)
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
